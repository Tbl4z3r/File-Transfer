[package]
name = "file-transfer-windows"
version = "0.1.6"
edition = "2024"
rust-version = "1.100"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
file-transfer-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-dialog = "=2.8.4"

[profile.dev]
debug = 0
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
