name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 protocol/validate_fixtures.py

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.100.0 fmt --manifest-path apps/windows/core/Cargo.toml --check
      - run: cargo +1.100.0 test --manifest-path apps/windows/core/Cargo.toml --locked
      - run: cargo +1.100.0 build --manifest-path apps/windows/core/Cargo.toml --locked --bin ft-core
      - run: python3 scripts/integration/smoke.py apps/windows/core/target/debug/ft-core
      - run: cargo +1.100.0 clippy --manifest-path apps/windows/core/Cargo.toml --locked --all-targets -- -D warnings

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 test --manifest-path apps/windows/core/Cargo.toml --locked
      - run: npm ci
        working-directory: apps/windows
      - run: npm run test:ui
        working-directory: apps/windows
      - run: cargo +1.100.0 test --manifest-path apps/windows/src-tauri/Cargo.toml --locked network::tests
      - run: npm run tauri -- build --no-bundle
        working-directory: apps/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-development-x64
          path: apps/windows/src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 build --manifest-path apps/windows/core/Cargo.toml --locked --bin ft-core
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: apps/android
        env:
          FT_CORE_BINARY: ${{ github.workspace }}/apps/windows/core/target/debug/ft-core
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci
        working-directory: apps/windows
      - run: npm run test:qr
        working-directory: apps/windows
      - run: python3 scripts/integration/verify_pairing_qr.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-development-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
